function pointInShape(x,y,o,pad=0){
 if(o.shape==='rect')return x>=o.x-pad&&x<=o.x+o.w+pad&&y>=o.y-pad&&y<=o.y+o.h+pad;
 if(o.shape==='segment'){
  const dx=o.x2-o.x,dy=o.y2-o.y,t=clamp(((x-o.x)*dx+(y-o.y)*dy)/(dx*dx+dy*dy||1),0,1);
  return (x-o.x-t*dx)**2+(y-o.y-t*dy)**2<=(o.r+pad)**2;
 }
 return (x-o.x)**2+(y-o.y)**2<=(o.r+pad)**2;
}
function bodyHitsShape(x,y,r,o){
 if(o.shape==='rect'){
  const cx=clamp(x,o.x,o.x+o.w),cy=clamp(y,o.y,o.y+o.h);
  return (x-cx)**2+(y-cy)**2<r*r;
 }

}
// v2.3.9: 이동 벡터를 작은 구간으로 나누고, 벽 모서리에서 자유 축을 우선 이동.
// 대각선으로 좁은 문을 지나갈 때 한 축의 충돌 때문에 다른 축까지 멈추지 않게 한다.
function moveWithCollision(x,y,nx,ny,r){
 const destX=clamp(nx,r,WORLD_W-r),destY=clamp(ny,r,WORLD_H-r);
 const dx=destX-x,dy=destY-y;
 const steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/Math.max(6,r*.45)));
 let px=x,py=y;
 const clear=(cx,cy)=>!terrainBlocks.some(o=>bodyHitsShape(cx,cy,r,o));
 for(let i=0;i<steps;i++){
  const sx=dx/steps,sy=dy/steps;
  // Combined move takes precedence: preserves smooth motion through open gaps.
  if(clear(px+sx,py+sy)){px+=sx;py+=sy;continue;}
  // Axis sliding: test each axis independently against the actual obstacle shape.
  // Prefer the longer component, avoiding a fixed horizontal bias at fence posts.
  if(Math.abs(sx)>=Math.abs(sy)){
   if(clear(px+sx,py))px+=sx;
   if(clear(px,py+sy))py+=sy;
  }else{
   if(clear(px,py+sy))py+=sy;
   if(clear(px+sx,py))px+=sx;
  }
 }
 return {x:clamp(px,r,WORLD_W-r),y:clamp(py,r,WORLD_H-r)};
}
function moveFactorAt(x,y){for(const z of slowZones)if(pointInShape(x,y,z))return .78;return 1}
function findWalkableNear(cx,cy,minR,maxR,tries=42){
  for(let i=0;i<tries;i++){
    const a=Math.random()*Math.PI*2,r=minR+Math.random()*(maxR-minR),x=clamp(cx+Math.cos(a)*r,PLAYER_RADIUS,WORLD_W-PLAYER_RADIUS),y=clamp(cy+Math.sin(a)*r,PLAYER_RADIUS,WORLD_H-PLAYER_RADIUS);
    let blocked=false;for(const o of terrainBlocks)if(bodyHitsShape(x,y,22,o)){blocked=true;break}
    if(!blocked)return {x,y,a};
  }
  return {x:clamp(cx,PLAYER_RADIUS,WORLD_W-PLAYER_RADIUS),y:clamp(cy,PLAYER_RADIUS,WORLD_H-PLAYER_RADIUS),a:0}
}

// v2.3.9: narrower paths between actual fences and tents are represented in the nav grid.
const NAV=32,NAV_COLS=Math.ceil(WORLD_W/NAV),NAV_ROWS=Math.ceil(WORLD_H/NAV);
const navSolid=new Uint8Array(NAV_COLS*NAV_ROWS),navCost=new Int16Array(NAV_COLS*NAV_ROWS);
let navGoal=-1,navElapsed=999,navReady=false;
const navIndex=(x,y)=>clamp(Math.floor(y/NAV),0,NAV_ROWS-1)*NAV_COLS+clamp(Math.floor(x/NAV),0,NAV_COLS-1);
function navBuild(){
 for(let y=0;y<NAV_ROWS;y++)for(let x=0;x<NAV_COLS;x++){
  const n=y*NAV_COLS+x,px=x*NAV+NAV/2,py=y*NAV+NAV/2;
  navSolid[n]=terrainBlocks.some(o=>bodyHitsShape(px,py,19,o))?1:0;
 }
 navReady=true;
}
function navRebuild(force=false){
 if(!player)return;
 if(!navReady)navBuild();
 const goal=navIndex(player.x,player.y);
 if(!force&&navElapsed<1.2&&goal===navGoal)return;
 navGoal=goal;navElapsed=0;navCost.fill(-1);
 // The player's cell remains usable even if its center touches a decorative obstacle.
 navCost[goal]=0;const queue=new Int32Array(navCost.length);let front=0,end=0;queue[end++]=goal;
 while(front<end){
  const v=queue[front++],x=v%NAV_COLS,y=Math.floor(v/NAV_COLS);
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
   const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=NAV_COLS||ny>=NAV_ROWS)continue;
   const n=ny*NAV_COLS+nx;if(navCost[n]!==-1||navSolid[n])continue;
   navCost[n]=navCost[v]+1;queue[end++]=n;
  }
 }
}
function navReachable(x,y){if(!navReady||navGoal<0)return true;const i=navIndex(x,y);return navCost[i]>=0&&!navSolid[i]}
function navSeek(e,tx,ty,retreat=false){
 const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy)||1;
 if(!retreat&&!segmentBlocked(e.x,e.y,tx,ty))return {x:dx/d,y:dy/d};
 const cell=navIndex(e.x,e.y),x=cell%NAV_COLS,y=Math.floor(cell/NAV_COLS);
 let best=-1,bestScore=Infinity;
 for(const [sx,sy] of [[1,0],[-1,0],[0,1],[0,-1]]){
  const nx=x+sx,ny=y+sy;if(nx<0||ny<0||nx>=NAV_COLS||ny>=NAV_ROWS)continue;
  const n=ny*NAV_COLS+nx,cost=navCost[n];if(navSolid[n]||cost<0)continue;
  const targetX=(nx+.5)*NAV,targetY=(ny+.5)*NAV;
  const score=(retreat?-cost:cost)*NAV + Math.hypot(e.x-targetX,e.y-targetY)*.34 + (segmentBlocked(e.x,e.y,targetX,targetY)?NAV*3:0);
  if(score<bestScore){best=n;bestScore=score}
 }
 if(best<0)return {x:dx/d,y:dy/d};
 const wx=(best%NAV_COLS+.5)*NAV,wy=(Math.floor(best/NAV_COLS)+.5)*NAV;
 let vx=wx-e.x,vy=wy-e.y,mag=Math.hypot(vx,vy)||1;
 return {x:vx/mag,y:vy/mag}
}
function navFindWalkable(cx,cy,minR,maxR,tries=64){
 for(let j=0;j<tries;j++){
  const a=Math.random()*Math.PI*2,r=minR+Math.random()*(maxR-minR);
  const x=clamp(cx+Math.cos(a)*r,25,WORLD_W-25),y=clamp(cy+Math.sin(a)*r,25,WORLD_H-25);
  if(!terrainBlocks.some(o=>bodyHitsShape(x,y,24,o))&&navReachable(x,y))return {x,y,a};
 }
 // Guaranteed locally reachable fallback: inspect neighboring cells.
 const cxCell=clamp(Math.floor(cx/NAV),0,NAV_COLS-1),cyCell=clamp(Math.floor(cy/NAV),0,NAV_ROWS-1);
 for(let ring=1;ring<18;ring++)for(let oy=-ring;oy<=ring;oy++)for(let ox=-ring;ox<=ring;ox++){
  if(Math.max(Math.abs(ox),Math.abs(oy))!==ring)continue;
  const x=(cxCell+ox+.5)*NAV,y=(cyCell+oy+.5)*NAV;
  if(x<25||y<25||x>WORLD_W-25||y>WORLD_H-25)continue;
  if(navReachable(x,y)&&!terrainBlocks.some(o=>bodyHitsShape(x,y,24,o)))return {x,y,a:Math.atan2(y-cy,x-cx)};
 }

}
function segmentBlocked(x1,y1,x2,y2){
  for(const o of terrainBlocks){if(!o.cover)continue;const steps=Math.max(1,Math.ceil(Math.hypot(x2-x1,y2-y1)/10));for(let i=0;i<=steps;i++){const t=i/steps,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;if(pointInShape(x,y,o,2))return true;}}
  return false
}

// v3.7: companion obstacle detours. Keeps the original collision radius and movement speed.
// Companion route recovery v3.8: pathfind only when short-range steering stops making progress.
// Uses the same collision shapes as the existing game; no teleporting or balance changes.
function companionPlanRoute(unit, tx, ty, radius) {
  const size=24, pad=170;
  const left=Math.max(radius, Math.min(unit.x,tx)-pad);
  const top=Math.max(radius, Math.min(unit.y,ty)-pad);
  const right=Math.min(WORLD_W-radius, Math.max(unit.x,tx)+pad);
  const bottom=Math.min(WORLD_H-radius, Math.max(unit.y,ty)+pad);
  const cols=Math.max(2,Math.ceil((right-left)/size)+1),rows=Math.max(2,Math.ceil((bottom-top)/size)+1);
  if(cols*rows>4500)return null;
  const loc=id=>({x:Math.min(right,left+(id%cols)*size),y:Math.min(bottom,top+Math.floor(id/cols)*size)});
  const cell=(x,y)=>Math.max(0,Math.min(rows-1,Math.round((y-top)/size)))*cols+
    Math.max(0,Math.min(cols-1,Math.round((x-left)/size)));
  const clearCache=new Int8Array(cols*rows);
  function clear(id) {
    if(clearCache[id])return clearCache[id]===1;
    const p=loc(id);
    const allowed=!terrainBlocks.some(o=>bodyHitsShape(p.x,p.y,radius+4,o));
    clearCache[id]=allowed?1:2;
    return allowed;
  }
  function nearest(x,y, requireReachable=false){
    let chosen=-1,best=Infinity,ix=Math.round((x-left)/size),iy=Math.round((y-top)/size);
    for(let r=0;r<6;r++){
      for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
        const cx=ix+dx,cy=iy+dy;
        if(cx<0||cy<0||cx>=cols||cy>=rows)continue;
        const n=cy*cols+cx;if(!clear(n))continue;
        const p=loc(n),d=Math.hypot(p.x-x,p.y-y);
        if(requireReachable){const moved=moveWithCollision(x,y,p.x,p.y,radius);if(Math.hypot(moved.x-p.x,moved.y-p.y)>3)continue;}
        if(d<best){best=d;chosen=n;}
      }
      if(chosen>=0)return chosen;
    }
    return -1;
  }
  const from=nearest(unit.x,unit.y,true),to=nearest(tx,ty);
  if(from<0||to<0)return null;
  const prev=new Int32Array(cols*rows).fill(-1);
  const queue=[from];let qi=0;prev[from]=from;
  const directions=[[1,0],[-1,0],[0,1],[0,-1]];
  while(qi<queue.length&&queue.length<4500){
    const n=queue[qi++];if(n===to)break;
    const cx=n%cols,cy=Math.floor(n/cols);
    for(const [dx,dy] of directions){
      const xx=cx+dx,yy=cy+dy;if(xx<0||yy<0||xx>=cols||yy>=rows)continue;
      const next=yy*cols+xx;
      if(prev[next]!==-1||!clear(next))continue;
      const a=loc(n),b=loc(next),walk=moveWithCollision(a.x,a.y,b.x,b.y,radius);
      if(Math.hypot(walk.x-b.x,walk.y-b.y)>2)continue;
      prev[next]=n;queue.push(next);
    }
  }
  if(prev[to]===-1)return null;
  const cells=[];let n=to;
  while(n!==from&&cells.length<4500){cells.push(n);n=prev[n];}
  cells.reverse();
  return {points:cells.map(loc),targetX:tx,targetY:ty,idx:0};
}
function companionStep(unit,tx,ty,dt,speed,radius){
  const total=Math.hypot(tx-unit.x,ty-unit.y);
  if(total<2){unit._companionPath=null;return;}
  const directClear=!terrainBlocks.some(o=>bodyHitsShape(unit.x,unit.y,radius,o)) &&
    !segmentBlocked(unit.x,unit.y,tx,ty);
  if(unit._companionPath && Math.hypot(unit._companionPath.targetX-tx,unit._companionPath.targetY-ty)>65){
    unit._companionPath=null;
  }
  let route=unit._companionPath;
  if(route){while(route.idx<route.points.length&&Math.hypot(route.points[route.idx].x-unit.x,route.points[route.idx].y-unit.y)<16)route.idx++;
    if(route.idx>=route.points.length){unit._companionPath=null;route=null;}
  }
  let goal=route?route.points[route.idx]:{x:tx,y:ty};
  let dx=goal.x-unit.x,dy=goal.y-unit.y,d=Math.hypot(dx,dy);
  if(d<.01)return;
  const move=Math.min(d,Math.max(0,speed*dt));
  const next=moveWithCollision(unit.x,unit.y,unit.x+dx/d*move,unit.y+dy/d*move,radius);
  const before=Math.hypot(tx-unit.x,ty-unit.y),traveled=Math.hypot(next.x-unit.x,next.y-unit.y);
  unit.x=next.x;unit.y=next.y;
  const after=Math.hypot(tx-unit.x,ty-unit.y);
  if(route){
    if(traveled<.05){unit._routeBlocked=(unit._routeBlocked||0)+dt;if(unit._routeBlocked>.85){unit._companionPath=null;unit._companionReplanTimer=0;unit._routeBlocked=0;}}else unit._routeBlocked=0;
  }else if(!directClear){
    // Straight line is blocked: compute a grid detour once, even if axis sliding occurs.
    unit._companionReplanTimer=(unit._companionReplanTimer||0)-dt;
    if(unit._companionReplanTimer<=0){
      const computed=companionPlanRoute(unit,tx,ty,radius);
      if(computed)unit._companionPath=computed;
      unit._companionReplanTimer=computed?1.2:.65;
    }
  }else{
    unit._companionReplanTimer=0;

   const tm=(document.getElementById('timer')?.textContent||'').trim();
   const ph=(document.getElementById('phase')?.textContent||'').trim();
   compactText.textContent=[hp&&('❤️ '+hp),tm&&('⏱ '+tm),ph].filter(Boolean).join('  ·  ');
 }
 mapBtn.addEventListener('click',()=>{window.__survivorMiniMapVisible=!window.__survivorMiniMapVisible;mapBtn.textContent=window.__survivorMiniMapVisible?'🗺 지도 접기':'🗺 지도';});
 function addPauseActions(){
   const panel=document.getElementById('panel'); if(!panel||document.getElementById('survivalPauseExtra'))return;
   const title=(panel.querySelector('h1')?.textContent||''); if(!title.includes('일시정지'))return;
   const box=document.createElement('div');box.id='survivalPauseExtra';
   const actions=[
     ['? 작전 안내',()=>guide.classList.add('open')],
     ['↻ 전투 다시 시작',()=>{const u=new URL(location.href);u.searchParams.set('survivorStart','1');location.href=u.toString();}],
     ['⌂ 베이스캠프',()=>location.href='../index.html'],
     ['🏫 역사 학습실',()=>location.href='https://tavia08.github.io/history-hub/'],
     ['⛶ 전체 화면',()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{});}]
   ];
   for(const [label,fn] of actions){const b=document.createElement('button');b.className='btn';b.textContent=label;b.onclick=fn;box.appendChild(b)}
   panel.appendChild(box);
 }
 menuBtn.addEventListener('click',()=>{if(oldPause){oldPause.click();setTimeout(addPauseActions,0)}});
 guide.addEventListener('click',e=>{if(e.target===guide||e.target.classList.contains('close'))guide.classList.remove('open')});
 new MutationObserver(()=>{sync();addPauseActions()}).observe(document.body,{subtree:true,attributes:true,attributeFilter:['style','class'],childList:true});
 setInterval(sync,180);sync();
})();
</script>
</body></html>
