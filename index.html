und:linear-gradient(180deg,#f1d79c,#bd8643);border-color:#ffe1a6;min-height:46px}.nav-btn:disabled{opacity:.45;cursor:default}.step{font-size:13px;color:#e6bd82;min-width:52px;text-align:center}.notice{padding:12px;border-radius:12px;border:1px solid #7b6344;background:#242119;font-size:12px;line-height:1.75;color:#d3c5ac}.toast[hidden]{display:none}.toast{position:absolute;bottom:11.2%;left:37%;width:36%;text-align:center;background:#1b1513ee;border:1px solid #dab37b;border-radius:12px;padding:11px;color:#f1d9b6;font-size:clamp(11px,1.1vw,17px);z-index:4}

.rank-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 16px}.rank-tab{padding:11px 18px;border:1px solid #d8b377;border-radius:12px;color:#fae7bf;background:linear-gradient(180deg,#44311b,#2a2219);font-weight:800;box-shadow:inset 0 1px 0 rgba(255,239,199,.16)}.rank-tab[aria-selected="true"]{background:linear-gradient(180deg,#f3d79a,#c08946);color:#2b1d10;border-color:#ffdba0;box-shadow:0 3px 12px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,250,221,.38)}.rank-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.rank-controls label{display:grid;gap:6px;color:#f7ddb4;font-size:13px;font-weight:700}.rank-controls select,.rank-controls input{min-width:0;width:100%;background:linear-gradient(180deg,#171411,#0f0f0e);color:#fff0cc;border:1px solid #997449;border-radius:10px;padding:12px 13px;box-shadow:inset 0 1px 0 rgba(255,239,214,.05)}.rank-list{width:100%;border-collapse:collapse;font-size:13px}.rank-list thead th{position:sticky;top:0;background:linear-gradient(180deg,#34281b,#241c15);z-index:1}.rank-list th,.rank-list td{border-bottom:1px solid rgba(103,83,56,.75);padding:11px 6px;text-align:center}.rank-list th{color:#f0cc91;font-weight:800}.rank-list tbody tr:nth-child(odd){background:rgba(255,244,213,.03)}.rank-scroll{max-height:37dvh;overflow:auto;margin-top:10px;border:1px solid rgba(159,126,79,.55);border-radius:12px;background:rgba(12,10,8,.24);padding:2px 10px 8px;box-shadow:inset 0 0 20px rgba(0,0,0,.14)}.rank-msg{font-size:13px;color:#f6d49e;line-height:1.7;min-height:22px}.rank-submit{background:linear-gradient(180deg,#efc87f,#be8642);border:1px solid #f5d39e;border-radius:12px;padding:12px 18px;font-weight:800;color:#211b13;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,250,221,.35);margin-top:4px}.rank-submit:disabled{opacity:.5;cursor:default}.rank-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 14px}.rank-card{padding:12px 12px 10px;border-radi <script>
'use strict';
const HUB_VERSION='v3.1';
const stages={
 gahan:{name:'가한목 전투',era:'1108년 · 고려',desc:'여진 정벌에 나선 고려군의 위기. 척준경이 되어 윤관을 찾고 안전하게 호위하세요.',goals:['본진을 방어하며 생존하기','윤관을 수색하여 찾아내기','윤관을 안전하게 호위하기'],live:true},
 hwang:{name:'황산벌 전투',era:'660년 · 백제',desc:'백제의 마지막 저항이 이어진 황산벌에서 계백의 이야기와 치열한 전투를 만납니다.',goals:['황산벌 전장에서 생존하기','위협을 피하며 전투 이어가기'],live:true},
 cheong:{name:'청해진의 밤',era:'9세기 · 신라 하대',desc:'장보고가 활동한 청해진을 배경으로 야간 해안 전장에서 생존에 도전합니다.',goals:['청해진의 야간 전장에서 생존하기','적의 공세를 견뎌내기'],live:true}
};
const slides=[
 ['1107년 · 여진 정벌','고려는 왜 여진 정벌에 나섰을까?','고려는 북방에서 여진 세력과 충돌했습니다. 윤관은 별무반을 편성하여 1107년 여진 정벌에 나섰고, 정벌 지역에 여러 성을 쌓았습니다.'],
 ['1108년 · 위기의 전장','가한촌 일대에서 위기가 닥치다','여진의 반격 속에서 고려군은 계속 전투를 벌였습니다. 윤관 등이 이끈 고려군이 가한촌 일대에서 위기에 처했고, 구원 전투가 펼쳐졌다는 기록이 전해집니다.'],
 ['고려의 무장 · 척준경','위기에 뛰어든 무장','척준경은 윤관의 여진 정벌에서 용맹한 활약을 펼친 고려 무장입니다. 게임 속에서는 척준경이 되어 윤관을 구출하는 임무를 수행합니다.'],
 ['조작 안내 · 전투 직전','척준경이 되어 출격하세요','이동: WASD · 방향키 · 화면 터치 조이스틱\n공격: 적에게 접근하면 도끼 자동 공격\n임무: 본진 방어 → 윤관 수색 → 윤관 호위\n전투 시작을 누르면 곧바로 진행됩니다.']
];

const extraSlides={
 hwang:[
  ['660년 · 삼국의 경쟁','백제는 왜 위기에 빠졌을까?','7세기 중반 신라는 당과 연합하여 백제를 공격했습니다. 백제는 국경을 지키기 위해 군대를 모아 맞섰습니다.'],
  ['황산벌 · 계백','계백이 이끄는 백제군','계백은 황산벌에서 백제군을 지휘하며 신라군의 진격을 막으려 했습니다. 신라군은 김유신이 이끌었습니다.'],
  ['황산벌 전투','치열한 싸움의 결과','황산벌에서 백제군은 신라군에 맞서 싸웠지만 패배했습니다. 이후 나당 연합군의 공격으로 백제는 멸망했습니다.'],
  ['조작 안내 · 전투 직전','황산벌로 출격하세요','이동: WASD · 방향키 · 화면 터치 조이스틱\n공격: 가까운 적에게 자동 공격\n강화: 획득한 경험치로 능력 강화\n목표: 6분간 생존하고 지휘부 격퇴 (게임 속 가상 역사)']
 ],
 cheong:[
  ['9세기 · 신라 하대','바다의 중요성이 커지다','통일 신라 시대에는 동아시아 여러 지역을 오가는 해상 교역이 활발했습니다. 하지만 해상에는 해적의 위협도 존재했습니다.'],
  ['장보고 · 청해진','장보고는 왜 청해진을 세웠을까?','장보고는 828년 오늘날 완도에 청해진을 설치하고 해적을 막으며 해상 교역의 안전을 확보하고자 했습니다.'],
  ['청해진의 활약','무역의 중심지가 된 청해진','청해진은 신라와 당, 일본을 잇는 해상 교류에서 중요한 역할을 했습니다. 장보고는 이곳을 기반으로 영향력을 넓혔습니다.'],
  ['조작 안내 · 전투 직전','청해진에서 장보고를 호위하세요','이동: WASD · 방향키 · 화면 터치 조이스틱\n공격: 가까운 적에게 검 자동 공격\n지원: 호위대와 특수 기술 활용\n목표: 장보고를 보호하며 염장을 막고 6분간 생존 (창작 임무)']
 ]
};
let selected='gahan',slide=0,mode='';let lastFocus=null;
const $=id=>document.getElementById(id),overlay=$('overlay'),actions=$('dialogActions');
function button(label,fn,primary=false,disabled=false){const b=document.createElement('button');b.type='button';b.className='nav-btn'+(primary?' primary':'');b.textContent=label;b.disabled=disabled;b.addEventListener('click',fn);actions.appendChild(b);return b;}
function openDialog(kind){lastFocus=document.activeElement;mode=kind;overlay.hidden=false;renderDialog();$('close').focus();}
function closeDialog(){overlay.hidden=true;if(lastFocus?.focus)lastFocus.focus();}
function renderDialog(){actions.replaceChildren();$('dialogNote').textContent='';const s=stages[selected];
 if(mode==='history'){
  const set=selected==='gahan'?slides:extraSlides[selected];
  $('dialogKicker').textContent=set[slide][0];$('dialogTitle').textContent=set[slide][1];$('dialogText').textContent=set[slide][2];
  $('dialogNote').textContent='역사적 사실과 게임을 위해 재구성한 상황을 구분해 설명했습니다.';
  button('이전',()=>{slide=Math.max(0,slide-1);renderDialog()},false,slide===0);
  const n=document.createElement('span');n.className='step';n.textContent=`${slide+1} / ${set.length}`;actions.appendChild(n);
  button(slide===set.length-1?(stages[selected].live?'전투 시작':'이야기 마치기'):'다음 이야기',()=>{
    if(slide===set.length-1){if(stages[selected].live)location.href=({gahan:'games/gahanmok.html?survivorStart=1',hwang:'games/hwangsanbeol.html?survivorStart=1',cheong:'games/cheonghaejin.html?survivorStart=1'})[selected];else closeDialog();}
    else {slide++;renderDialog();}
  },true);return;
 }
 if(mode==='records'){
   $('dialogKicker').textContent='생존 기록 · 명예의 전당';
   $('dialogTitle').textContent='생존자의 기록';
   $('dialogText').replaceChildren();$('dialogNote').textContent='전투별 개인 기록과 학급 랭킹입니다. 본명 대신 4글자 이하 이니셜을 사용하세요.';
   showRecordTabs();return;
 }
 if(mode==='settings'){$('dialogKicker').textContent='베이스캠프';$('dialogTitle').textContent='설정';$('dialogText').textContent='화면 비율에 따라 캠프 전체가 보이도록 구성했습니다. 좁은 화면에서는 가로로 이동해 메뉴를 선택할 수 있습니다.';button('확인',closeDialog,true);return;}
 if(mode==='wait'){$('dialogKicker').textContent='전장 연결 대기';$('dialogTitle').textContent=s.name;$('dialogText').textContent='이 전장의 게임 파일은 아직 허브에 연결되지 않았습니다. 연결 전에는 게임을 시작할 수 없습니다.';button('확인',closeDialog,true);return;}
}

const RANK_ENDPOINT=(window.SURVIVOR_RANK_URL||'').trim();
const RK_STAGES=[['hwang','황산벌 전투'],['cheong','청해진의 밤'],['gahan','가한목 전투']];
let rankTab='mine',rankScope='all',rankSelected='hwang';
function rankNum(x){return Number.isFinite(Number(x))?Math.max(0,Math.floor(Number(x))):0}
function rankRead(k,f={}){try{return JSON.parse(localStorage.getItem(k)||'null')||f}catch{return f}}
function rankMine(stage){
 if(stage==='gahan'){
   const x=rankRead('HistorySurvivor_Gahanmok_v1_records');
   return {attempts:rankNum(x.attempts),wins:rankNum(x.wins),score:rankNum(x.bestScore),seconds:rankNum(x.bestSeconds),kills:rankNum(x.mostKills)};
 }
 const key=stage==='hwang'?'Hwangsanbeol':'Cheonghaejin';
 const saved=rankRead('HistorySurvivor_'+key+'_v229');
 const best=rankRead('HistorySurvivor_'+key+'_score_v229');
 const hist=rankRead('HistorySurvivor_'+key+'_analytics_v229',[]);
 const runs=Array.isArray(hist)?hist.filter(x=>x&&typeof x==='object'):[];
 return {attempts:Math.max(rankNum(saved.attempts),runs.length),wins:Math.max(rankNum(saved.wins),runs.filter(x=>x.result==='승리').length),score:Math.max(rankNum(best.best),...runs.map(x=>rankNum(x.score)),0),seconds:Math.max(rankNum(saved.best),...runs.map(x=>rankNum(x.survivalSec)),0),kills:Math.max(rankNum(saved.kills),...runs.map(x=>rankNum(x.normalKills)+rankNum(x.eliteKills)+rankNum(x.bossKills)),0)};
}
function rankTime(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function node(tag,txt='',cls=''){const x=document.createElement(tag);x.textContent=txt;if(cls)x.className=cls;return x}
function jsonp(params){return new Promise((resolve,reject)=>{
 if(!/^https:\/\/script\.google\.com\/macros\/s\//.test(RANK_ENDPOINT)){reject(new Error('구글시트 연결 설정이 필요합니다.'));return}
 const cb='historySurvivorCB'+Math.random().toString(36).slice(2);const sc=document.createElement('script');let finished=false;
 const timer=setTimeout(()=>finish(new Error('서버 응답 시간 초과')),12000);
 function finish(err,data){if(finished)return;finished=true;clearTimeout(timer);delete window[cb];sc.remove();err?reject(err):resolve(data)}
 window[cb]=data=>finish(null,data);sc.onerror=()=>finish(new Error('네트워크 요청에 실패했습니다.'));
 const q=new URLSearchParams({...params,callback:cb});sc.src=RANK_ENDPOINT+'?'+q.toString();document.head.appendChild(sc);
 })}
function showRecordTabs(){
 const box=$('dialogText');box.replaceChildren();box.style.whiteSpace='normal';
 const tabs=node('div','','rank-tabs');['mine','board'].forEach((k,i)=>{const b=node('button',i?'🏆 명예의 전당':'📜 내 기록','rank-tab');b.type='button';b.setAttribute('aria-selected',String(rankTab===k));b.onclick=()=>{rankTab=k;showRecordTabs()};tabs.appendChild(b)});box.appendChild(tabs);
 const controls=node('div','','rank-controls');
 function selector(label,items,val,onChange){const wrapper=node('label',label);const sel=document.createElement('select');for(const [k,t] of items){const opt=new Option(t,k);sel.add(opt)}sel.value=val;sel.onchange=()=>onChange(sel.value);wrapper.appendChild(sel);controls.appendChild(wrapper);return sel}
 selector('전장 선택',RK_STAGES,rankSelected,v=>{rankSelected=v;showRecordTabs()});
 if(rankTab==='board')selector('랭킹 범위',[['all','전체'],...Array.from({length:15},(_,i)=>[String(i+1),`${i+1}반`])],rankScope,v=>{rankScope=v;showRecordTabs()});
 box.appendChild(controls);
 const r=rankMine(rankSelected);
 if(rankTab==='mine'){
  const info=node('div',`도전 ${r.attempts}회 · 승리 ${r.wins}회\n최고 점수 ${r.score.toLocaleString()}점 · 최고 생존 ${rankTime(r.seconds)}\n최다 처치 ${r.kills}명`,'rank-msg');info.style.whiteSpace='pre-line';box.appendChild(info);
  const fields=node('div','','rank-controls');
  function field(label,el){const l=node('label',label);l.appendChild(el);fields.appendChild(l);return el}
  const cl=document.createElement('select');for(let i=1;i<=15;i++)cl.add(new Option(i+'반',String(i)));cl.value=localStorage.getItem('survivorRankClass')||'1';field('학급',cl);
  const nick=document.createElement('input');nick.type='text';nick.maxLength=4;nick.placeholder='이니셜 4글자';nick.value=localStorage.getItem('survivorRankInitials')||'';field('이니셜',nick);
  box.appendChild(fields);
  const send=node('button','내 최고 기록 등록','rank-submit');box.appendChild(send);
  const msg=node('div','','rank-msg');box.appendChild(msg);
  const help=node('div','전투별 개인 기록과 학급 랭킹입니다. 본명 대신 4글자 이하 이니셜을 사용하세요.','rank-help');box.appendChild(help);
  if(!RANK_ENDPOINT){msg.textContent='현재 랭킹 서버 미연결: 안내문에 따라 Apps Script 배포 주소를 설정하면 등록할 수 있습니다.';send.disabled=true}
  send.onclick=async()=>{
    const name=nick.value.trim();if(!/^[가-힣A-Za-z0-9]{1,4}$/.test(name)){msg.textContent='이니셜은 한글·영문·숫자 1~4자로 입력하세요.';return}
    if(r.attempts<1||r.score<1){msg.textContent='점수가 있는 게임 기록이 생성된 후 등록할 수 있습니다.';return}
    send.disabled=true;msg.textContent='랭킹 등록 중…';try{
      const ans=await jsonp({action:'submit',stage:rankSelected,cls:cl.value,name,score:String(r.score),seconds:String(r.seconds),kills:String(r.kills),wins:String(r.wins),attempts:String(r.attempts)});
      if(!ans.ok)throw new Error(ans.error||'등록 실패');
      localStorage.setItem('survivorRankClass',cl.value);localStorage.setItem('survivorRankInitials',name);msg.textContent='등록되었습니다. 명예의 전당에서 확인하세요.';
    }catch(e){msg.textContent='등록 실패: '+e.message}finally{send.disabled=false}
  };
 }else{
  const msg=node('div','조회 중…','rank-msg');box.appendChild(msg);
  const wrap=node('div','','rank-scroll');box.appendChild(wrap);
  if(!RANK_ENDPOINT){msg.textContent='랭킹 서버 미연결: Apps Script 배포 주소 설정 후 순위가 표시됩니다.';return}
  const requestKey=rankSelected+'|'+rankScope;
  jsonp({action:'list',stage:rankSelected,cls:rankScope}).then(data=>{
    if(mode!=='records'||rankTab!=='board'||rankSelected+'|'+rankScope!==requestKey)return;
    if(!data.ok)throw new Error(data.error||'조회 실패');msg.textContent=(data.rows||[]).length?'상위 10명':'아직 등록된 기록이 없습니다.';
    const boardHelp=node('div',`전투별 개인 기록과 ${rankScope==='all'?'전체':'학급'} 랭킹입니다. 본명 대신 4글자 이하 이니셜을 사용하세요.`,'rank-help');
    wrap.replaceChildren(boardHelp);
    const table=node('table','','rank-list'),head=node('tr');['순위','이니셜','반','점수','생존'].forEach(x=>head.appendChild(node('th',x)));const th=node('thead');th.appendChild(head);table.appendChild(th);const body=node('tbody');
    (data.rows||[]).forEach((row,i)=>{const tr=node('tr');[i+1,row.name,row.cls+'반',Number(row.score).toLocaleString(),rankTime(rankNum(row.seconds))].forEach(v=>tr.appendChild(node('td',String(v))));body.appendChild(tr)});table.appendChild(body);wrap.appendChild(table);
  }).catch(e=>{msg.textContent='조회 실패: '+e.message});
 }
}
function selectStage(id){
 if(!stages[id])return;
 selected=id;
 try{sessionStorage.setItem('HistorySurvivor_selectedStage',id)}catch(e){}
 document.querySelectorAll('[data-stage]').forEach(el=>{
  const active=el.dataset.stage===id;
  el.classList.toggle('stage-active',active);
  el.setAttribute('aria-pressed',String(active));
 });
 ['gahan','hwang','cheong'].forEach(key=>document.getElementById('panel-'+key).classList.toggle('active',key===id));
}
document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>selectStage(b.dataset.stage)));
let resume='gahan';try{const saved=sessionStorage.getItem('HistorySurvivor_selectedStage');if(stages[saved])resume=saved}catch(e){}selectStage(resume);
$('history').addEventListener('click',()=>{slide=0;openDialog('history')});$('records').addEventListener('click',()=>openDialog('records'));$('settings').addEventListener('click',()=>openDialog('settings'));
$('start').addEventListener('click',()=>{slide=0;openDialog(stages[selected].live?'history':'wait')});$('close').addEventListener('click',closeDialog);overlay.addEventListener('click',e=>{if(e.target===overlay)closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)closeDialog()});
</script></body></html>
