<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#17120f"><title>역사에서 살아남는 법 | 생존자의 베이스캠프</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#100e0e;color:#f8ead1;font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #fff4be;outline-offset:1px}.shell{min-height:100dvh;display:flex;align-items:center;justify-content:center}.stage{position:relative;width:min(100vw,177.68dvh);aspect-ratio:1672/941;background:url('assets/camp_fixed.png') center / 100% 100% no-repeat;overflow:hidden;box-shadow:0 0 40px #000}.hit{position:absolute;border:2px solid transparent;background:transparent;border-radius:10px;color:transparent;padding:0;transition:border .15s,background .15s}.hit:hover,.hit:focus-visible{background:#f8d28512;border-color:#f9d18c;box-shadow:0 0 18px #e6a44299;color:transparent}.hit.selected{border-color:#ffce69;box-shadow:inset 0 0 11px #ffb94466,0 0 15px #ffb9446e}.hit.default-selected{border-color:transparent;box-shadow:none}.hit.waiting-selected{border-color:#f4c86a;box-shadow:0 0 18px #ffc66b88}.hit:active{background:#f8d28555}
/* The clickable areas correspond to the fixed 1672 × 941 artwork. */
.h-gahan{left:1.8%;top:24.4%;width:24.9%;height:16.0%}.h-hwang{left:1.8%;top:41.2%;width:24.9%;height:16.0%}.h-cheong{left:1.8%;top:57.6%;width:24.9%;height:16.2%}.h-history{left:29.5%;top:79.1%;width:20.4%;height:10.7%}.h-record{left:50.4%;top:79.1%;width:20.5%;height:10.7%}.h-start{left:76.1%;top:79.8%;width:22.1%;height:10.4%}.h-settings{left:2.0%;top:91.3%;width:8.6%;height:6.3%}
.overlay[hidden]{display:none}.overlay{position:fixed;inset:0;z-index:15;background:#080807d9;display:grid;place-items:center;padding:14px}.dialog{width:min(690px,100%);max-height:90dvh;overflow:auto;background:linear-gradient(145deg,#2b251b,#171b19);border:2px solid #d0a565;border-radius:18px;padding:clamp(19px,3vw,30px);box-shadow:0 24px 75px #000c}.dialog-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.kicker{font-size:12px;color:#f8c67f;letter-spacing:.16em;font-weight:800}.dialog h2{font-size:clamp(22px,3.8vw,33px);margin:12px 0;color:#ffefd1}.dialog p{font-size:15px;line-height:1.83;color:#ebe2d1;white-space:pre-line}.small{font-size:12px!important;color:#d0bda0!important}.close,.nav-btn{background:#332b20;border:1px solid #aa8a5f;color:#ffe8be;border-radius:10px;padding:10px 14px;font-weight:800}.actions{display:flex;gap:10px;margin-top:18px;align-items:center}.nav-btn.primary{flex:1;color:#25180e;background:linear-gradient(#f4d99e,#c38c4e);border-color:#ffe1a6;min-height:46px}.nav-btn:disabled{opacity:.45;cursor:default}.step{font-size:13px;color:#e6bd82;min-width:52px;text-align:center}.notice{padding:12px;border-radius:10px;border:1px solid #7b6344;background:#242119;font-size:12px;line-height:1.75;color:#d3c5ac}.toast[hidden]{display:none}.toast{position:absolute;bottom:11.2%;left:37%;width:36%;text-align:center;background:#1b1513ee;border:1px solid #dab37b;border-radius:12px;padding:11px;color:#f1d9b6;font-size:clamp(11px,1.1vw,17px);z-index:4}
@media(max-aspect-ratio:1672/941){.stage{width:100vw;max-width:100vw}}@media(max-width:700px){.shell{min-height:100dvh;align-items:flex-start}.stage{margin-top:16px;width:100vw;min-width:720px}.shell{overflow-x:auto;justify-content:flex-start}.overlay{position:fixed}.toast{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Fixed 1672 × 941 canvas; only right briefing and selection indicator change. */
.h-gahan{left:2.6%;top:21.6%;width:24.5%;height:18.6%}
.h-hwang{left:2.6%;top:40.7%;width:24.5%;height:17.8%}
.h-cheong{left:2.6%;top:59.4%;width:24.5%;height:18%}
.h-history{left:29.7%;top:82%;width:19.1%;height:11%}
.h-record{left:49.6%;top:82%;width:19.1%;height:11%}
.h-start{left:73.2%;top:82.5%;width:22.4%;height:11%}
.h-settings{left:2%;top:92%;width:7.5%;height:6.5%}
.stage-panel{position:absolute;left:71.95%;top:9.25%;width:23.86%;height:70.78%;pointer-events:none;z-index:1;object-fit:fill;opacity:0;transition:opacity .16s ease}
.stage-panel.active{opacity:1}
.hit{z-index:2}
.hit.stage-active{border:3px solid #ffd17a;box-shadow:inset 0 0 8px #f3af5055,0 0 12px #efaf4e88}

@media(prefers-reduced-motion:reduce){.stage-panel{transition:none}}
</style></head><body><main class="shell"><section class="stage" aria-label="생존자의 베이스캠프 전장 선택 화면">
<img id="panel-gahan" class="stage-panel" src="assets/panel_gahan.png" alt="" aria-hidden="true"><img id="panel-hwang" class="stage-panel" src="assets/panel_hwang.png" alt="" aria-hidden="true"><img id="panel-cheong" class="stage-panel" src="assets/panel_cheong.png" alt="" aria-hidden="true"><button class="hit h-gahan" data-stage="gahan" aria-label="가한목 전투 선택"></button><button class="hit h-hwang" data-stage="hwang" aria-label="황산벌 전투 선택"></button><button class="hit h-cheong" data-stage="cheong" aria-label="청해진의 밤 선택"></button>
<button class="hit h-history" id="history" aria-label="역사 이야기 열기"></button><button class="hit h-record" id="records" aria-label="생존 기록 보기"></button><button class="hit h-start" id="start" aria-label="선택한 전장 전투개시"></button><button class="hit h-settings" id="settings" aria-label="설정 열기"></button>
<div class="toast" id="toast" hidden></div>
</section></main><div class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><article class="dialog"><div class="dialog-top"><span class="kicker" id="dialogKicker"></span><button class="close" id="close" type="button">닫기 ×</button></div><h2 id="dialogTitle"></h2><p id="dialogText"></p><p class="small" id="dialogNote"></p><div class="actions" id="dialogActions"></div></article></div>
<script>
'use strict';
const HUB_VERSION='v2.6';
const stages={
 gahan:{name:'가한목 전투',era:'1108년 · 고려',desc:'여진 정벌에 나선 고려군의 위기. 척준경이 되어 윤관을 찾고 안전하게 호위하세요.',goals:['본진을 방어하며 생존하기','윤관을 수색하여 찾아내기','윤관을 안전하게 호위하기'],live:true},
 hwang:{name:'황산벌 전투',era:'660년 · 백제',desc:'백제의 마지막 저항이 이어진 황산벌에서 계백의 이야기와 치열한 전투를 만납니다.',goals:['황산벌 전장에서 생존하기','위협을 피하며 전투 이어가기'],live:true},
 cheong:{name:'청해진의 밤',era:'9세기 · 신라 하대',desc:'장보고가 활동한 청해진을 배경으로 야간 해안 전장에서 생존에 도전합니다.',goals:['청해진의 야간 전장에서 생존하기','적의 공세를 견뎌내기'],live:true}
};
const slides=[
 ['1107년 · 여진 정벌','고려는 왜 여진 정벌에 나섰을까?','고려는 북방에서 여진 세력과 충돌했습니다. 윤관은 별무반을 편성하여 1107년 여진 정벌에 나섰고, 정벌 지역에 여러 성을 쌓았습니다.'],
 ['1108년 · 위기의 전장','가한촌 일대에서 위기가 닥치다','여진의 반격 속에서 고려군은 계속 전투를 벌였습니다. 윤관 등이 이끈 고려군이 가한촌 일대에서 위기에 처했고, 구원 전투가 펼쳐졌다는 기록이 전해집니다.'],
 ['고려의 무장 · 척준경','위기에 뛰어든 무장','척준경은 윤관의 여진 정벌에서 용맹한 활약을 펼친 고려 무장입니다. 게임 속에서는 척준경이 되어 윤관을 구출하는 임무를 수행합니다.'],
 ['게임 임무 · 3단계 생존','당신이 척준경입니다','1단계: 본진 방어\n2단계: 윤관 수색\n3단계: 윤관 호위\n이동과 도끼 자동 공격을 활용해 마지막까지 살아남으세요.']
];

const extraSlides={
 hwang:[
  ['660년 · 삼국의 경쟁','백제는 왜 위기에 빠졌을까?','7세기 중반 신라는 당과 연합하여 백제를 공격했습니다. 백제는 국경을 지키기 위해 군대를 모아 맞섰습니다.'],
  ['황산벌 · 계백','계백이 이끄는 백제군','계백은 황산벌에서 백제군을 지휘하며 신라군의 진격을 막으려 했습니다. 신라군은 김유신이 이끌었습니다.'],
  ['황산벌 전투','치열한 싸움의 결과','황산벌에서 백제군은 신라군에 맞서 싸웠지만 패배했습니다. 이후 나당 연합군의 공격으로 백제는 멸망했습니다.'],
  ['게임 속 임무','당신은 황산벌의 전장에 있습니다','계백의 시대를 배경으로 공격을 피하고 적의 공세에서 생존하는 게임입니다. 게임의 공격 방식과 생존 임무는 역사적 사건을 바탕으로 재구성했습니다.']
 ],
 cheong:[
  ['9세기 · 신라 하대','바다의 중요성이 커지다','통일 신라 시대에는 동아시아 여러 지역을 오가는 해상 교역이 활발했습니다. 하지만 해상에는 해적의 위협도 존재했습니다.'],
  ['장보고 · 청해진','장보고는 왜 청해진을 세웠을까?','장보고는 828년 오늘날 완도에 청해진을 설치하고 해적을 막으며 해상 교역의 안전을 확보하고자 했습니다.'],
  ['청해진의 활약','무역의 중심지가 된 청해진','청해진은 신라와 당, 일본을 잇는 해상 교류에서 중요한 역할을 했습니다. 장보고는 이곳을 기반으로 영향력을 넓혔습니다.'],
  ['게임 속 임무','어둠 속에서 살아남아라','게임에서는 청해진을 배경으로 야간에 적을 피하고 살아남는 임무를 수행합니다. 야간 습격과 구체적인 전투 장면은 게임을 위한 창작 설정입니다.']
 ]
};
let selected='gahan',slide=0,mode='';let lastFocus=null;
const $=id=>document.getElementById(id),overlay=$('overlay'),actions=$('dialogActions');
function button(label,fn,primary=false,disabled=false){const b=document.createElement('button');b.type='button';b.className='nav-btn'+(primary?' primary':'');b.textContent=label;b.disabled=disabled;b.addEventListener('click',fn);actions.appendChild(b);return b;}
function openDialog(kind){lastFocus=document.activeElement;mode=kind;overlay.hidden=false;renderDialog();$('close').focus();}
function closeDialog(){overlay.hidden=true;if(lastFocus?.focus)lastFocus.focus();}
function renderDialog(){actions.replaceChildren();$('dialogNote').textContent='';const s=stages[selected];
 if(mode==='history'){
  const set=selected==='gahan'?slides:extraSlides[selected];
  $('dialogKicker').textContent=set[slide][0];$('dialogTitle').textContent=set[slide][1];$('dialogText').textContent=set[slide][2];
  $('dialogNote').textContent='역사적 사실과 게임을 위해 재구성한 상황을 구분해 설명했습니다.';
  button('이전',()=>{slide=Math.max(0,slide-1);renderDialog()},false,slide===0);
  const n=document.createElement('span');n.className='step';n.textContent=`${slide+1} / ${set.length}`;actions.appendChild(n);
  button(slide===set.length-1?(stages[selected].live?'전투개시':'이야기 마치기'):'다음 이야기',()=>{
    if(slide===set.length-1){if(stages[selected].live)location.href=({gahan:'games/gahanmok.html',hwang:'games/hwangsanbeol.html',cheong:'games/cheonghaejin.html'})[selected];else closeDialog();}
    else {slide++;renderDialog();}
  },true);return;
 }
 if(mode==='records'){
  $('dialogKicker').textContent='생존 기록';
  $('dialogTitle').textContent='나의 전장 기록';
  const lines=[];
  const configs=[
    ['황산벌 전투','HistorySurvivor_Hwangsanbeol_v229','HistorySurvivor_Hwangsanbeol_score_v229','HistorySurvivor_Hwangsanbeol_analytics_v229'],
    ['청해진의 밤','HistorySurvivor_Cheonghaejin_v229','HistorySurvivor_Cheonghaejin_score_v229','HistorySurvivor_Cheonghaejin_analytics_v229']
  ];
  let storageOK=true;
  const readJSON=(key,fallback)=>{const raw=localStorage.getItem(key);if(!raw)return fallback;try{return JSON.parse(raw)}catch{return fallback}};
  const natural=x=>Number.isFinite(Number(x))?Math.max(0,Math.floor(Number(x))):0;
  const formatTime=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
  for(const [name,key,scoreKey,analyticsKey] of configs){
    try{
      const saved=readJSON(key,{}),scoreData=readJSON(scoreKey,{}),runs=readJSON(analyticsKey,[]);
      const history=Array.isArray(runs)?runs.filter(x=>x&&typeof x==='object'):[];
      const completed=history.length;
      const recordedWins=history.filter(x=>x.result==='승리').length;
      const attempts=Math.max(natural(saved.attempts),completed);
      const wins=Math.max(natural(saved.wins),recordedWins);
      const bestSeconds=Math.max(natural(saved.best),...history.map(x=>natural(x.survivalSec)),0);
      const bestScore=Math.max(natural(scoreData.best),...history.map(x=>natural(x.score)),0);
      const kills=Math.max(natural(saved.kills),...history.map(x=>natural(x.normalKills)+natural(x.eliteKills)+natural(x.bossKills)),0);
      if(!attempts&&!completed){lines.push(name+'\n  아직 저장된 기록이 없습니다.');continue;}
      lines.push(name+'\n  도전 '+attempts+'회 · 승리 '+wins+'회 · 최고 생존 '+formatTime(bestSeconds)+' · 최고 점수 '+bestScore.toLocaleString('ko-KR')+'점 · 최다 처치 '+kills+'명');
    }catch(e){storageOK=false;lines.push(name+'\n  이 환경에서는 기록을 읽을 수 없습니다.');}
  }
  try {
    const raw=localStorage.getItem('HistorySurvivor_Gahanmok_v1_records');
    if(!raw){lines.push('가한목 전투\n  아직 저장된 기록이 없습니다.');}
    else {
      const r=JSON.parse(raw); const safe=n=>Number.isFinite(Number(n))?Math.max(0,Math.floor(Number(n))):0;
      const sec=safe(r.bestSeconds);
      const bestTime=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
      lines.push('가한목 전투\n  종료된 도전 '+safe(r.attempts)+'회 · 승리 '+safe(r.wins)+'회 · 최고 생존 '+bestTime+' · 최고 점수 '+safe(r.bestScore).toLocaleString()+'점 · 최다 처치 '+safe(r.mostKills)+'명');
    }
  } catch(e){lines.push('가한목 전투\n  기록을 읽을 수 없습니다.');}
  $('dialogText').textContent=lines.join('\n\n');
  $('dialogNote').textContent=storageOK?'최고 기록과 최근 전투 기록을 함께 확인합니다. 브라우저별 로컬 기록이므로 다른 기기와 자동 합산되지 않습니다.':'브라우저 보안 설정에 따라 기록 조회가 제한될 수 있습니다.';
  button('확인',closeDialog,true);return;
}
 if(mode==='settings'){$('dialogKicker').textContent='베이스캠프';$('dialogTitle').textContent='설정';$('dialogText').textContent='화면 비율에 따라 캠프 전체가 보이도록 구성했습니다. 좁은 화면에서는 가로로 이동해 메뉴를 선택할 수 있습니다.';button('확인',closeDialog,true);return;}
 if(mode==='wait'){$('dialogKicker').textContent='전장 연결 대기';$('dialogTitle').textContent=s.name;$('dialogText').textContent='이 전장의 게임 파일은 아직 허브에 연결되지 않았습니다. 연결 전에는 게임을 시작할 수 없습니다.';button('확인',closeDialog,true);return;}
}
function selectStage(id){
 if(!stages[id])return;
 selected=id;
 try{sessionStorage.setItem('HistorySurvivor_selectedStage',id)}catch(e){}
 document.querySelectorAll('[data-stage]').forEach(el=>{
  const active=el.dataset.stage===id;
  el.classList.toggle('stage-active',active);
  el.setAttribute('aria-pressed',String(active));
 });
 ['gahan','hwang','cheong'].forEach(key=>document.getElementById('panel-'+key).classList.toggle('active',key===id));
}
document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>selectStage(b.dataset.stage)));
let resume='gahan';try{const saved=sessionStorage.getItem('HistorySurvivor_selectedStage');if(stages[saved])resume=saved}catch(e){}selectStage(resume);
$('history').addEventListener('click',()=>{slide=0;openDialog('history')});$('records').addEventListener('click',()=>openDialog('records'));$('settings').addEventListener('click',()=>openDialog('settings'));
$('start').addEventListener('click',()=>{slide=0;openDialog(stages[selected].live?'history':'wait')});$('close').addEventListener('click',closeDialog);overlay.addEventListener('click',e=>{if(e.target===overlay)closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)closeDialog()});
</script></body></html>
